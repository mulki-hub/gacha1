<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Royale Platinum</title>
    <style>
        :root { --primary: #6200ea; --gold: #ffd700; --bg: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; text-align: center; margin: 0; }
        .hidden { display: none !important; }
        
        /* Login Page */
        #login-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        input { padding: 12px; border-radius: 8px; border: none; margin: 10px; width: 250px; }
        button { padding: 12px 25px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }

        /* Main Page */
        #main-page { padding: 20px; }
        .slot-machine { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }
        .slot { width: 90px; height: 90px; border: 4px solid #444; border-radius: 15px; background: #333; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* Catalog */
        .catalog { display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
        .item-card { background: #2a2a2a; padding: 15px; border-radius: 12px; width: 150px; border: 1px solid #444; }
        .item-img { width: 100%; height: 90px; background: #3d3d3d; border-radius: 8px; margin-bottom: 10px; font-size: 3rem; display: flex; align-items: center; justify-content: center; }
        .price { color: var(--gold); font-weight: bold; display: block; margin-bottom: 10px; }
        .btn-tukar { background: #27ae60; width: 100%; font-size: 0.9rem; }

        /* Success Page */
        #success-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0f2027; }
        .receipt { background: white; color: black; padding: 30px; border-radius: 10px; border-top: 8px dashed #0f2027; width: 80%; max-width: 400px; }
        .wa-link { background: #25d366; text-decoration: none; color: white; padding: 15px 30px; border-radius: 30px; margin-top: 20px; display: inline-block; font-weight: bold; }

        /* Secret Panel */
        #secret-trigger { position: fixed; bottom: 10px; right: 10px; width: 30px; height: 30px; background: rgba(255,255,255,0.05); cursor: pointer; }
        #admin-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2c3e50; padding: 25px; border-radius: 15px; border: 3px solid var(--gold); z-index: 100; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <div id="login-page">
        <h1>GACHA SYSTEM</h1>
        <input type="text" id="username-input" placeholder="Masukkan Nama Anda...">
        <button onclick="login()">MULAI BERMAIN</button>
    </div>

    <div id="main-page" class="hidden">
        <h2 id="display-name" style="margin-bottom: 5px;">User</h2>
        <h3 style="color: var(--gold); margin-top: 0;">Coins: <span id="coin-count">100</span></h3>

        <div class="slot-machine">
            <div id="slot1" class="slot">?</div>
            <div id="slot2" class="slot">?</div>
            <div id="slot3" class="slot">?</div>
        </div>
        <button onclick="spinGacha()" id="spin-btn" style="padding: 15px 50px; font-size: 1.1rem;">SPIN (20 Coin)</button>
        <p id="msg" style="height: 20px; font-weight: bold;"></p>

        <div class="catalog">
            <div class="item-card">
                <div class="item-img">🗡️</div>
                <p>Mythic Sword</p>
                <span class="price">1500 Coin</span>
                <button class="btn-tukar" onclick="tukarItem('Mythic Sword')">TUKAR</button>
            </div>
            <div class="item-card">
                <div class="item-img">🛡️</div>
                <p>Titan Shield</p>
                <span class="price">1500 Coin</span>
                <button class="btn-tukar" onclick="tukarItem('Titan Shield')">TUKAR</button>
            </div>
            <div class="item-card">
                <div class="item-img">💍</div>
                <p>Power Ring</p>
                <span class="price">1500 Coin</span>
                <button class="btn-tukar" onclick="tukarItem('Power Ring')">TUKAR</button>
            </div>
        </div>
    </div>

    <div id="success-page" class="hidden">
        <div class="receipt">
            <h2 style="margin: 0;">BERHASIL DITUKAR!</h2>
            <hr>
            <p id="item-info" style="font-size: 1.2rem; font-weight: bold;"></p>
            <p id="time-info" style="color: #666;"></p>
            <p style="background: #ffffcc; padding: 10px; font-size: 0.9rem;"><b>PENTING:</b> Silakan Screenshot halaman ini dan kirim ke Admin untuk klaim!</p>
        </div>
        <a href="https://wa.me/6281234567890?text=Halo%20Admin,%20saya%20ingin%20klaim%20item%20gacha%20saya" class="wa-link">HUBUNGI ADMIN VIA WHATSAPP</a>
        <br>
        <button onclick="backToGame()" style="background: transparent; border: 1px solid white; margin-top: 20px;">Kembali ke Game</button>
    </div>

    <div id="secret-trigger" onclick="promptSecret()"></div>

    <div id="admin-panel" class="hidden">
        <h3>Admin Settings</h3>
        <label>Set Win Rate:</label><br>
        <select id="rate-set" style="padding: 5px; width: 100%; margin: 10px 0;">
            <option value="fair">Fair (5%)</option>
            <option value="jp">Auto JP (100%)</option>
            <option value="lose">Auto Lose (0%)</option>
        </select>
        <hr>
        <label>Gift Coin:</label><br>
        <input type="text" id="target-user" placeholder="Nama User" style="width: 90%; color: black;">
        <input type="number" id="gift-amount" placeholder="Jumlah" style="width: 90%; color: black;">
        <button onclick="sendGift()" style="width: 100%; margin-top: 10px;">Kirim Coin</button>
        <br><br>
        <button onclick="closeAdmin()" style="background: #e74c3c; width: 100%;">Tutup Menu</button>
    </div>

    <script>
        let currentUser = "";
        let coins = 100;
        let winSetting = "fair";
        const colors = ["🔴", "🔵", "🟢"];

        function login() {
            const name = document.getElementById('username-input').value;
            if(name) {
                currentUser = name;
                document.getElementById('display-name').innerText = "Player: " + name;
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-page').classList.remove('hidden');
            }
        }

        function updateUI() {
            document.getElementById('coin-count').innerText = coins;
        }

        function spinGacha() {
            if (coins < 20) return alert("Coin tidak cukup!");
            
            coins -= 20;
            updateUI();
            
            let s1, s2, s3;
            const rand = Math.random() * 100;
            let isWin = false;

            if (winSetting === "jp") isWin = true;
            else if (winSetting === "lose") isWin = false;
            else if (rand <= 5) isWin = true;

            if (isWin) {
                const winColor = colors[Math.floor(Math.random() * colors.length)];
                s1 = s2 = s3 = winColor;
                coins += 200;
                document.getElementById('msg').innerText = "🔥 JACKPOT! +200 COIN 🔥";
                document.getElementById('msg').style.color = "#ffd700";
            } else {
                s1 = colors[Math.floor(Math.random() * colors.length)];
                s2 = colors[Math.floor(Math.random() * colors.length)];
                s3 = colors[Math.floor(Math.random() * colors.length)];
                if(s1 === s2 && s2 === s3) s3 = colors[(colors.indexOf(s3) + 1) % 3]; 
                document.getElementById('msg').innerText = "Coba lagi...";
                document.getElementById('msg').style.color = "white";
            }

            document.getElementById('slot1').innerText = s1;
            document.getElementById('slot2').innerText = s2;
            document.getElementById('slot3').innerText = s3;
            updateUI();
        }

        function tukarItem(itemName) {
            if (coins < 1500) {
                alert("Koin tidak cukup! Anda butuh 1500 coin untuk menukar " + itemName);
            } else {
                coins -= 1500;
                updateUI();
                showSuccess(itemName);
            }
        }

        function showSuccess(itemName) {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID');

            document.getElementById('item-info').innerText = "Item: " + itemName;
            document.getElementById('time-info').innerText = dateStr + " | " + timeStr;
            
            document.getElementById('main-page').classList.add('hidden');
            document.getElementById('success-page').classList.remove('hidden');
        }

        function backToGame() {
            document.getElementById('success-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
        }

        // Fitur Rahasia
        function promptSecret() {
            const code = prompt("Masukkan Kode Rahasia:");
            if (code === "gerry22") {
                document.getElementById('admin-panel').classList.remove('hidden');
            }
        }

        function closeAdmin() {
            winSetting = document.getElementById('rate-set').value;
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function sendGift() {
            const target = document.getElementById('target-user').value;
            const amount = parseInt(document.getElementById('gift-amount').value);
            
            if (target === currentUser) {
                coins += amount;
                updateUI();
                alert("Berhasil mengirim koin ke akun " + target);
            } else {
                alert("User " + target + " tidak terdeteksi di sesi ini, koin gagal dikirim.");
            }
        }
    </script>
</body>
</html>
